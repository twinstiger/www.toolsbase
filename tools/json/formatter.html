<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON Formatter - Local Dev Tools | No Upload Required</title>
    <meta name="description" content="Free online JSON formatter and beautifier. Format, minify, and validate JSON data locally in your browser. No uploads, 100% secure.">
    <meta name="keywords" content="json formatter, json beautifier, json validator, format json, prettify json">
    <script src="https://cdn.tailwindcss.com"></script>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9420599375364457"
            crossorigin="anonymous"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../css/style.css">
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background: linear-gradient(135deg, #f5f7fa 0%, #e8ecf1 100%);
        }
        .dark body { 
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
        }
        textarea.code-editor {
            font-family: 'Fira Code', monospace;
            font-size: 14px;
            line-height: 1.6;
        }
    </style>
</head>
<body class="text-gray-800 dark:text-gray-100 min-h-screen transition-colors duration-300">
    <!-- Header -->
    <header class="glass-effect shadow-lg sticky top-0 z-50 transition-all duration-300">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <a href="../../index.html" class="flex items-center gap-2 group">
                <span class="text-2xl group-hover:-translate-x-1 transition-transform">←</span>
                <span class="text-xl font-bold bg-gradient-to-r from-blue-600 to-purple-600 bg-clip-text text-transparent group-hover:opacity-80 transition-opacity">Back to Tools</span>
            </a>
            <button id="theme-toggle" class="p-3 rounded-xl bg-white/80 dark:bg-slate-800/80 hover:bg-white dark:hover:bg-slate-700 shadow-md hover:shadow-lg transition-all duration-300 group">
                <svg id="sun-icon" class="w-6 h-6 hidden dark:block text-yellow-500 group-hover:rotate-180 transition-transform duration-500" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z" clip-rule="evenodd"/>
                </svg>
                <svg id="moon-icon" class="w-6 h-6 block dark:hidden text-indigo-600 group-hover:-rotate-12 transition-transform duration-500" fill="currentColor" viewBox="0 0 20 20">
                    <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"/>
                </svg>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-6xl mx-auto px-4 py-12">
        <div class="bg-white dark:bg-slate-800 rounded-3xl shadow-2xl p-8 border border-gray-100 dark:border-slate-700 animate-fade-in-up">
            <!-- Title Section -->
            <div class="mb-8">
                <h1 class="text-4xl font-bold mb-3 bg-gradient-to-r from-blue-600 to-purple-600 bg-clip-text text-transparent">JSON Formatter & Validator</h1>
                <p class="text-gray-600 dark:text-gray-400 text-lg">Format, minify, and validate JSON data - all processing happens locally</p>
            </div>

            <!-- Input Section -->
            <div class="mb-6">
                <label class="block font-medium mb-2 text-gray-700 dark:text-gray-300">Input JSON:</label>
                <textarea id="input" class="code-editor w-full h-64 px-4 py-3 input-enhanced bg-gradient-to-br from-gray-50 to-gray-100 dark:from-slate-700 dark:to-slate-800 rounded-2xl border-0 resize-none" placeholder='Paste your JSON here...&#10;Example: {"name":"John","age":30,"city":"New York"}'></textarea>
            </div>

            <!-- Action Buttons -->
            <div class="flex flex-wrap gap-3 mb-6">
                <button onclick="formatJSON()" class="btn-primary">
                    ✨ Format / Beautify
                </button>
                <button onclick="minifyJSON()" class="btn-secondary">
                    📦 Minify
                </button>
                <button onclick="validateJSON()" class="px-6 py-3 bg-gradient-to-r from-green-500 to-green-600 text-white rounded-xl font-semibold hover:from-green-600 hover:to-green-700 shadow-lg hover:shadow-xl transition-all">
                    ✅ Validate
                </button>
                <button onclick="clearAll()" class="px-6 py-3 bg-gray-500 text-white rounded-xl font-semibold hover:bg-gray-600 shadow-lg transition-all">
                    🗑️ Clear
                </button>
            </div>

            <!-- Output Section -->
            <div class="mb-6">
                <label class="block font-medium mb-2 text-gray-700 dark:text-gray-300">Output:</label>
                <textarea id="output" readonly class="code-editor w-full h-64 px-4 py-3 result-display rounded-2xl border-0 resize-none" placeholder="Formatted JSON will appear here..."></textarea>
            </div>

            <!-- Status Message -->
            <div id="status" class="hidden p-4 rounded-xl"></div>

            <!-- Options -->
            <div class="mt-6 p-6 bg-blue-50 dark:bg-blue-900/20 rounded-xl border border-blue-200 dark:border-blue-800">
                <h3 class="font-bold text-blue-800 dark:text-blue-300 mb-3">Options:</h3>
                <div class="flex items-center gap-4">
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" id="indent2" checked class="w-4 h-4 text-blue-600 rounded focus:ring-blue-500">
                        <span class="text-sm text-blue-800 dark:text-blue-300">2 spaces indent</span>
                    </label>
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" id="sortKeys" class="w-4 h-4 text-blue-600 rounded focus:ring-blue-500">
                        <span class="text-sm text-blue-800 dark:text-blue-300">Sort keys</span>
                    </label>
                </div>
            </div>

            <!-- Pro Tip -->
            <div class="mt-6 p-4 bg-blue-50 dark:bg-blue-900/20 rounded-xl border border-blue-200 dark:border-blue-800">
                <p class="text-sm text-blue-800 dark:text-blue-300 text-center">
                    💡 <strong>Pro Tip:</strong> Paste messy JSON and click "Format" to make it readable. All processing happens in your browser!
                </p>
            </div>
        </div>
    </main>

    <script src="../../js/theme-toggle.js"></script>
    <script>
        function formatJSON() {
            const input = document.getElementById('input').value.trim();
            const output = document.getElementById('output');
            const status = document.getElementById('status');
            
            if (!input) {
                showStatus('Please enter some JSON first!', 'error');
                return;
            }
            
            try {
                let parsed = JSON.parse(input);
                
                // Sort keys if option is selected
                if (document.getElementById('sortKeys').checked) {
                    parsed = sortObjectKeys(parsed);
                }
                
                const indent = document.getElementById('indent2').checked ? 2 : 4;
                output.value = JSON.stringify(parsed, null, indent);
                showStatus('✅ JSON formatted successfully!', 'success');
            } catch (e) {
                showStatus('❌ Invalid JSON: ' + e.message, 'error');
            }
        }
        
        function minifyJSON() {
            const input = document.getElementById('input').value.trim();
            const output = document.getElementById('output');
            const status = document.getElementById('status');
            
            if (!input) {
                showStatus('Please enter some JSON first!', 'error');
                return;
            }
            
            try {
                const parsed = JSON.parse(input);
                output.value = JSON.stringify(parsed);
                showStatus('✅ JSON minified successfully!', 'success');
            } catch (e) {
                showStatus('❌ Invalid JSON: ' + e.message, 'error');
            }
        }
        
        function validateJSON() {
            const input = document.getElementById('input').value.trim();
            const status = document.getElementById('status');
            
            if (!input) {
                showStatus('Please enter some JSON first!', 'error');
                return;
            }
            
            try {
                JSON.parse(input);
                showStatus('✅ Valid JSON! Syntax is correct.', 'success');
            } catch (e) {
                showStatus('❌ Invalid JSON: ' + e.message, 'error');
            }
        }
        
        function clearAll() {
            document.getElementById('input').value = '';
            document.getElementById('output').value = '';
            document.getElementById('status').classList.add('hidden');
        }
        
        function sortObjectKeys(obj) {
            if (Array.isArray(obj)) {
                return obj.map(sortObjectKeys);
            } else if (obj !== null && typeof obj === 'object') {
                return Object.keys(obj).sort().reduce((result, key) => {
                    result[key] = sortObjectKeys(obj[key]);
                    return result;
                }, {});
            }
            return obj;
        }
        
        function showStatus(message, type) {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = `p-4 rounded-xl ${type === 'success' ? 'success-state' : 'error-state'}`;
            status.classList.remove('hidden');
            
            setTimeout(() => {
                status.classList.add('hidden');
            }, 3000);
        }
    </script>
</body>
</html>
