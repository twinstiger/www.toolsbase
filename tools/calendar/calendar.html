const MONTHS_LONG = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const MONTHS_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const WEEKDAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

let currentCountry = 'US';
let currentYear = new Date().getFullYear();
let currentMonth = new Date().getMonth();
let currentDay = new Date().getDate();
let viewMode = 'month'; // 'month', 'week', 'day'

function getHolidayColor(type) {
  if (!type) return '#6b7280';
  for (const [k, v] of Object.entries(TYPE_COLORS)) {
    if (type.includes(k)) return v;
  }
  return '#6b7280';
}

function getHolidaysForCountry(country) {
  return COUNTRIES[country]?.holidays || {};
}

function getHolidayInfo(country, dateStr) {
  const holidays = getHolidaysForCountry(country);
  return holidays[dateStr] || null;
}

function showHolidayModal(country, dateStr) {
  const info = getHolidayInfo(country, dateStr);
  if (!info) return;
  const date = new Date(dateStr + 'T00:00:00');
  const modal = document.getElementById('holidayModal');
  document.getElementById('modalDate').textContent = date.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
  document.getElementById('modalName').textContent = info.name;
  document.getElementById('modalType').textContent = info.type || 'Holiday';
  document.getElementById('modalType').style.borderColor = getHolidayColor(info.type);
  document.getElementById('modalDesc').textContent = info.desc || '';
  modal.classList.add('active');
}

function hideHolidayModal() {
  document.getElementById('holidayModal').classList.remove('active');
}

// Render Month View
function renderMonthView(holidayMap) {
  let html = '<div class="months-row">';
  for (let m = 0; m < 12; m++) {
    html += renderMonthCard(currentYear, m, holidayMap);
  }
  html += '</div>';
  return html;
}

function renderMonthCard(year, month, holidayMap) {
  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const today = new Date();
  const isCurrentMonth = today.getFullYear() === year && today.getMonth() === month;

  let html = `<div class="month-cal">
    <div class="month-hdr">
      <span class="month-name">${MONTHS_LONG[month]}</span>
    </div>
    <div class="cal-grid">
      <div class="wk-row hdr-row">${WEEKDAYS.map(d => `<div class="wk-hdr">${d}</div>`).join('')}</div>`;

  let day = 1;
  for (let w = 0; w < 6; w++) {
    html += '<div class="wk-row">';
    for (let d = 0; d < 7; d++) {
      if (w === 0 && d < firstDay) {
        html += '<div class="day-cell empty"></div>';
      } else if (day > daysInMonth) {
        html += '<div class="day-cell empty"></div>';
      } else {
        const dateStr = `${year}-${String(month + 1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
        const holiday = holidayMap[dateStr];
        const isToday = isCurrentMonth && day === today.getDate();
        const dayOfWeek = new Date(year, month, day).getDay();
        const satSunClass = dayOfWeek === 0 ? ' sun' : dayOfWeek === 6 ? ' sat' : '';

        if (holiday) {
          const color = getHolidayColor(holiday.type);
          html += `<div class="day-cell holiday${satSunClass}" style="--hc:${color};" data-date="${dateStr}">
            <span class="day-n${isToday ? ' today' : ''}" style="color:${color}">${day}</span>
          </div>`;
        } else {
          html += `<div class="day-cell${satSunClass}" data-date="${dateStr}">
            <span class="day-n${isToday ? ' today' : ''}">${day}</span>
          </div>`;
        }
        day++;
      }
    }
    html += '</div>';
    if (day > daysInMonth && w >= 5) break;
  }

  html += '</div>';

  // Add holiday list below the calendar grid
  const monthHolidays = Object.entries(holidayMap).filter(([date]) => {
    const d = new Date(date + 'T00:00:00');
    return d.getFullYear() === year && d.getMonth() === month;
  }).sort((a, b) => a[0].localeCompare(b[0]));

  if (monthHolidays.length > 0) {
    html += '<div class="month-hol-list">';
    for (const [date, info] of monthHolidays) {
      const color = getHolidayColor(info.type);
      const dayNum = new Date(date + 'T00:00:00').getDate();
      html += `<div class="mh-list-item" style="border-left-color:${color};">
        <span class="mh-list-date">${dayNum}</span>
        <span class="mh-list-name" style="color:${color}">${info.name}</span>
      </div>`;
    }
    html += '</div>';
  }

  html += '</div>';
  return html;
}

        }

      }
    }
    html += '</div>';
    if (day > daysInMonth && w >= 5) break;

  html += '</div>';

    const d = new Date(date + 'T00:00:00');

// Render Day View (current day with all holidays + historical events)

  const day = String(today.getDate()).padStart(2, '0');
  const dateStr = `${today.getFullYear()}-${month}-${day}`;
  const monthDay = `${month}-${day}`;
  const holidays = getHolidaysForCountry(currentCountry);

  let html = `<div class="day-view">
    <div class="day-header">
      <span class="day-label">${WEEKDAYS[today.getDay()]}, ${MONTHS_LONG[today.getMonth()]} ${today.getDate()}, ${today.getFullYear()}</span>
    </div>
    <div class="day-content">`;

  const allHolidaysForDay = Object.entries(holidays).filter(([date]) => date === dateStr);
  if (allHolidaysForDay.length > 0) {
    for (const [date, info] of allHolidaysForDay) {
      const color = getHolidayColor(info.type);
      html += `<div class="day-hol-card" style="border-color:${color};">
        <div class="dhc-name" style="color:${color}">${info.name}</div>
        <div class="dhc-type">${info.type}</div>
        <div class="dhc-desc">${info.desc || ''}</div>
      </div>`;
    }
  } else {
    html += '<div class="day-no-hol">No holidays on this day</div>';
  }

  // Add historical events section
  const events = HISTORY_EVENTS[monthDay];
  if (events && events.length > 0) {
    html += '<div class="day-section-title">On This Day</div>';
    for (const evt of events) {
      html += `<div class="day-event-item">
        <span class="de-year">${evt.year}</span>
        <span class="de-text">${evt.text}</span>
      </div>`;
    }
  }

  html += '</div></div>';
  return html;
}

function renderCalendar() {
  const container = document.getElementById('calendarContainer');
  const holidays = getHolidaysForCountry(currentCountry);
  const holidayMap = holidays;

  document.getElementById('yearDisplay').textContent = currentYear;
  document.getElementById('calTitle').textContent = `${COUNTRIES[currentCountry].name} ${currentYear} Calendar`;

  let html = '';
  if (viewMode === 'month') {
    html = renderMonthView(holidayMap);
  } else if (viewMode === 'week') {
    html = renderWeekView(holidayMap);
  } else {
    html = renderDayView(holidayMap);
  }
  container.innerHTML = html;

  // Add hover listeners for month/week view holidays
  if (viewMode === 'month' || viewMode === 'week') {
    document.querySelectorAll('.day-cell.holiday').forEach(cell => {
      cell.addEventListener('mouseenter', (e) => {
        const dateStr = cell.dataset.date;
        if (dateStr) showHolidayModal(currentCountry, dateStr);
      });
      cell.addEventListener('mouseleave', hideHolidayModal);
      cell.addEventListener('click', () => {
        const dateStr = cell.dataset.date;
        if (dateStr) showHolidayModal(currentCountry, dateStr);
      });
    });
  }
}

function changeYear(delta) {
  currentYear += delta;
  renderCalendar();
}

function switchCountry(country) {
  currentCountry = country;
  sessionStorage.setItem('preferredCountry', country);
  document.querySelectorAll('.country-tab').forEach(t => t.classList.toggle('active', t.dataset.country === country));
  renderCalendar();
}

async function init() {
  const preferred = sessionStorage.getItem('preferredCountry');
  if (preferred && COUNTRIES[preferred]) {
    switchCountry(preferred);
    return;
  }
  // Auto detect via IP
  try {
    const res = await fetch('https://ip-api.com/json/?fields=countryCode');
    const data = await res.json();
    const code = data.countryCode;
    const codeMap = { US:['US','USA'], GB:['GB','UK','GBR'], CA:['CA','CAN'], AU:['AU','AUS'], DE:['DE','DEU'], FR:['FR','FRA'], IT:['IT','ITA'], ES:['ES','ESP'] };
    for (const [c, codes] of Object.entries(codeMap)) {
      if (codes.includes(code)) {
        if (c !== 'US') {
          document.getElementById('locationHint').style.display = 'inline-block';
          document.getElementById('locationText').textContent = `Auto selected: ${COUNTRIES[c].name}`;
        }
        switchCountry(c);
        return;
      }
    }
  } catch (e) {}
  switchCountry('US');
}

// Event listeners
document.querySelectorAll('.country-tab').forEach(t => t.addEventListener('click', () => switchCountry(t.dataset.country)));
document.getElementById('prevYear').addEventListener('click', () => changeYear(-1));
document.getElementById('nextYear').addEventListener('click', () => changeYear(1));

document.querySelectorAll('.view-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    viewMode = btn.dataset.view;
    renderCalendar();
  });
});

document.getElementById('modalClose').addEventListener('click', hideHolidayModal);
document.getElementById('holidayModal').addEventListener('click', (e) => {
  if (e.target.id === 'holidayModal') hideHolidayModal();
});

document.addEventListener('DOMContentLoaded', init);
</script>
<style>
