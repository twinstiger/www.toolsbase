<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- 背景圆角矩形（可选，若需透明背景可删除此层） -->
  <rect width="512" height="512" rx="80" fill="#1E2A3A" />
  
  <!-- 齿轮（左侧） -->
  <g transform="translate(160, 256)">
    <circle cx="0" cy="0" r="48" fill="none" stroke="#3498DB" stroke-width="20" />
    <circle cx="0" cy="0" r="24" fill="#3498DB" />
    <!-- 齿轮齿 -->
    <rect x="-8" y="-72" width="16" height="32" fill="#3498DB" rx="4" />
    <rect x="-8" y="40" width="16" height="32" fill="#3498DB" rx="4" />
    <rect x="-72" y="-8" width="32" height="16" fill="#3498DB" rx="4" />
    <rect x="40" y="-8" width="32" height="16" fill="#3498DB" rx="4" />
    <!-- 斜齿 -->
    <rect x="36" y="-52" width="16" height="32" fill="#3498DB" rx="4" transform="rotate(45, 44, -36)" />
    <rect x="-52" y="-52" width="16" height="32" fill="#3498DB" rx="4" transform="rotate(-45, -44, -36)" />
    <rect x="-52" y="20" width="16" height="32" fill="#3498DB" rx="4" transform="rotate(45, -44, 36)" />
    <rect x="36" y="20" width="16" height="32" fill="#3498DB" rx="4" transform="rotate(-45, 44, 36)" />
  </g>

  <!-- 扳手（右侧） -->
  <g transform="translate(340, 256) rotate(15)">
    <!-- 扳手柄 -->
    <rect x="-12" y="-80" width="24" height="160" rx="12" fill="#E67E22" />
    <!-- 扳手开口 -->
    <path d="M-32,-80 L-32,-120 L-12,-120 L-12,-80 Z" fill="#1E2A3A" />
    <path d="M32,-80 L32,-120 L12,-120 L12,-80 Z" fill="#1E2A3A" />
    <circle cx="0" cy="-120" r="32" fill="none" stroke="#E67E22" stroke-width="20" />
    <!-- 开口内部阴影 -->
    <rect x="-24" y="-112" width="48" height="20" fill="#1E2A3A" />
  </g>

  <!-- 文字：ToolsBase -->
  <text x="256" y="420" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="bold" fill="#ECF0F1" text-anchor="middle" letter-spacing="4">ToolsBase</text>
  
  <!-- 副标语（小字，可选） -->
  <text x="256" y="460" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#7F8C8D" text-anchor="middle" letter-spacing="2">online tools</text>
</svg>