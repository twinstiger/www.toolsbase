<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9420599375364457"
            crossorigin="anonymous"></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="../logo.svg">
    
    <!-- SEO Meta Tags -->
    <title>Blog - ToolsBase | Developer Tips & Tutorials</title>
    <meta name="description" content="Read articles about developer tools, productivity tips, and best practices for using online tools.">
    <meta name="keywords" content="blog, developer tools, tutorials, productivity, online tools">
    <meta name="author" content="ToolsBase">
    <meta name="robots" content="index, follow">
    
    <!-- Open Graph -->
    <meta property="og:title" content="Blog - ToolsBase">
    <meta property="og:description" content="Developer tips, tutorials, and tool usage guides">
    <meta property="og:type" content="website">
    <meta property="og:image" content="../logo.svg">
    
    <!-- Canonical URL -->
    <link rel="canonical" href="https://toolsbase.net/blog/index.html">
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Blog - ToolsBase | Developer Tips & Tutorials">
    <meta name="twitter:description" content="Read articles about developer tools, productivity tips, and best practices for using online tools.">
    
    <link rel="stylesheet" href="../styles.css">
    <script src="../modules/blog.js" defer></script>
    <style>
        .blog-search {
            width: 100%;
            max-width: 600px;
            margin: 0 auto 30px;
            padding: 15px 20px;
            font-size: 16px;
            border: 2px solid #4caf50;
            border-radius: 30px;
            outline: none;
        }

        .blog-filter {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-bottom: 30px;
        }

        .filter-tag {
            padding: 8px 20px;
            border-radius: 20px;
            cursor: pointer;
            border: 2px solid #e0e0e0;
            background: white;
            transition: all 0.3s;
        }

        .filter-tag:hover, .filter-tag.active {
            background: #4caf50;
            color: white;
            border-color: #4caf50;
        }

        .blog-container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }
        
        .blog-header {
            text-align: center;
            margin-bottom: 50px;
        }
        
        .blog-header h1 {
            font-size: 2.5rem;
            color: #2e7d32;
            margin-bottom: 10px;
        }
        
        .blog-header p {
            color: #666;
            font-size: 1.1rem;
        }
        
        .blog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
            margin-bottom: 50px;
        }
        
        .blog-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            border: 2px solid #e0e0e0;
            overflow: hidden;
            transition: all 0.3s ease;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            display: block;
        }
        
        .blog-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 24px rgba(76, 175, 80, 0.2);
            border-color: #4caf50;
        }
        
        .blog-card-image {
            width: 100%;
            height: 200px;
            background-size: cover;
            background-position: center;
            background: #667eea;
        }
        
        .blog-card-content {
            padding: 30px;
        }
        
        .blog-card h2 {
            font-size: 1.5rem;
            color: #2e7d32;
            margin-bottom: 15px;
            line-height: 1.4;
        }
        
        .blog-card .excerpt {
            color: #666;
            line-height: 1.8;
            margin-bottom: 20px;
            font-size: 15px;
        }
        
        .blog-card .read-more {
            color: #4caf50;
            font-weight: 600;
            font-size: 14px;
        }
        
        .blog-card .meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #e0e0e0;
            font-size: 13px;
            color: #999;
        }
        
        .blog-card .tag {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <a href="../index.html" style="text-decoration: none; cursor: pointer; display: flex; align-items: center; gap: 12px;">
                        <img src="../logo.svg" alt="Tools Base Logo" style="height: 48px; width: auto;">
                        <h1 style="margin: 0;"><span class="logo-tool">toolsbase.net</span></h1>
                    </a>
                    <p class="tagline">Local, Fast, No Uploads • 100% Privacy Protected</p>
                </div>
                <nav class="nav">
                    <a href="../index.html" class="btn" style="text-decoration: none;">← Back to Tools</a>
                </nav>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main">
        <div class="blog-container">
            <div class="blog-header">
                <h1>📚 Blog</h1>
                <p>Discover tips, tutorials, and best practices for using developer tools</p>
            </div>

            <input type="text" class="blog-search" id="blog-search" placeholder="🔍 Search articles..." onkeyup="filterArticles()">

            <div class="blog-filter">
                <button class="filter-tag active" onclick="setFilter('all', this)">All</button>
                <button class="filter-tag" onclick="setFilter('productivity', this)">⚡ Productivity</button>
                <button class="filter-tag" onclick="setFilter('development', this)">💻 Development</button>
                <button class="filter-tag" onclick="setFilter('security', this)">🔒 Security</button>
                <button class="filter-tag" onclick="setFilter('privacy', this)">🔐 Privacy</button>
                <button class="filter-tag" onclick="setFilter('tips', this)">💡 Tips</button>
            </div>

            <div class="blog-grid" id="blog-grid"></div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 Tools Base. All processing happens locally in your browser. No data is ever uploaded.</p>
            <p style="margin-top: 10px;">
                <a href="../privacy-policy.html" style="color: #4caf50; text-decoration: none; margin: 0 10px;">Privacy Policy</a> | 
                <a href="../about.html" style="color: #4caf50; text-decoration: none; margin: 0 10px;">About Us</a> | 
                <a href="../contact.html" style="color: #4caf50; text-decoration: none; margin: 0 10px;">Contact Us</a>
            </p>
        </div>
    </footer>
</body>
</html>
